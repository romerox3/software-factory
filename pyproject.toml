[project]
name = "software-factory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "jsonschema>=4.26.0",
    "lizard==1.25.0",
    "pyarrow>=26.0.0",
    "pydriller>=2.12",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
  "ruff",
  "pytest",
  "check-jsonschema",
  "respx>=0.23.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Out of scope: vendored spike fixtures and a throwaway docs asset.
extend-exclude = ["docs/assets", "spikes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
