[project]
name = "software-factory"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "ruff",
  "pytest",
  "jsonschema",
  "check-jsonschema",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Out of scope: vendored spike fixtures and a throwaway docs asset.
extend-exclude = ["docs/assets", "spikes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
