# Agent Swarm spike (ADR-0013): one Claude Code worker behind the factory gateway.
# Trimmed from upstream docker-compose.example.yml (v2.7.10). Values live in .env
# (see .env.example); host names, keys and image digests never enter this repo.
#
# Networks:
#   swarm-int  internal, no route out. Every service except the egress proxy.
#   egress     a routed network; only the egress proxy is on it.
#   host-port  a routed network for the api-port relay, which publishes the api on
#              127.0.0.1:3013 (Docker publishes no ports of internal-only services).
#   verifier   internal: the api and the verifier relay. The worker is not on it,
#              so it cannot reach the verifier (rule 3).
# The relay forwards to the host-side verifier service through a Unix socket in
# VERIFIER_SOCKET_DIR, so it needs no route to the host. With no routed network the
# api also cannot run its hard-coded models.dev catalog refresh (no off switch).
# The worker resolves the gateway host to the egress proxy, which forwards raw TCP
# to the gateway on 443: TLS stays end to end and nothing else is reachable.

x-telemetry-off: &telemetry-off
  ANONYMIZED_TELEMETRY: "false"
  DO_NOT_TRACK: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

x-claude-gateway: &claude-gateway
  HARNESS_PROVIDER: claude
  ANTHROPIC_BASE_URL: https://${GATEWAY_HOST}
  ANTHROPIC_AUTH_TOKEN: ${SWARM_WORKER_KEY}
  ANTHROPIC_DEFAULT_OPUS_MODEL: ${WORKER_MODEL}
  ANTHROPIC_DEFAULT_SONNET_MODEL: ${WORKER_MODEL}
  ANTHROPIC_DEFAULT_HAIKU_MODEL: ${WORKER_MODEL}
  # The context-mode plugin's tool hook runs `npm install`, which hangs with no egress.
  CONTEXT_MODE_DISABLED: "true"

services:
  minio:
    image: ${MINIO_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - agent_fs_minio:/data
    networks: [swarm-int]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: ${MINIO_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/agentfs &&
      mc version enable local/agentfs
      "
    networks: [swarm-int]

  agent-fs:
    image: ${AGENT_FS_IMAGE}
    platform: linux/amd64
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AGENT_FS_HOME: /data
      HOST: 0.0.0.0
      SERVER_HOST: 0.0.0.0
      PORT: "7433"
      SERVER_PORT: "7433"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: agentfs
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_PROVIDER: minio
      EMBEDDING_PROVIDER: local
    volumes:
      - agent_fs_data:/data
    networks: [swarm-int]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7433/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    image: ${SWARM_API_IMAGE}
    platform: linux/amd64
    stop_grace_period: 60s
    pids_limit: 1024
    depends_on:
      agent-fs:
        condition: service_healthy
    environment:
      <<: *telemetry-off
      API_KEY: ${API_KEY}
      RBAC_ENABLED: "true"
      AGENT_FS_API_URL: http://agent-fs:7433
      SECRETS_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      MCP_BASE_URL: http://api:3013
      SLACK_DISABLE: "true"
      GITHUB_DISABLE: "true"
      RUNTIME_POOLS_ENABLED: "false"
    volumes:
      - swarm_api_data:/app/data
    secrets:
      - encryption_key
    networks:
      swarm-int: {}
      verifier: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3013/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  egress-proxy:
    image: ${SOCAT_IMAGE}
    command: ["TCP-LISTEN:443,fork,reuseaddr", "TCP:${GATEWAY_HOST}:443"]
    networks:
      swarm-int:
        ipv4_address: 172.31.240.250
      egress: {}
    restart: unless-stopped

  api-port:
    image: ${SOCAT_IMAGE}
    command: ["TCP-LISTEN:3013,fork,reuseaddr", "TCP:api:3013"]
    ports:
      - "127.0.0.1:3013:3013"
    networks: [swarm-int, host-port]
    restart: unless-stopped

  verifier-proxy:
    image: ${SOCAT_IMAGE}
    command: ["TCP-LISTEN:8787,fork,reuseaddr", "UNIX-CONNECT:/run/verifier/verifier.sock"]
    volumes:
      - ${VERIFIER_SOCKET_DIR}:/run/verifier
    networks: [verifier]
    restart: unless-stopped

  worker:
    image: ${SWARM_WORKER_IMAGE}
    platform: linux/amd64
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: [*telemetry-off, *claude-gateway]
      API_KEY: ${API_KEY}
      AGENT_ID: ${WORKER_AGENT_ID}
      AGENT_ROLE: worker
      MCP_BASE_URL: http://api:3013
      AGENT_FS_API_URL: http://agent-fs:7433
      GITHUB_EMAIL: worker@localhost
      GITHUB_NAME: Spike Worker
    extra_hosts:
      - "${GATEWAY_HOST}:172.31.240.250"
    volumes:
      - swarm_logs:/logs
      - swarm_worker:/workspace/personal
      - ${SPIKE_WORK_DIR}:/workspace/tasks
    networks: [swarm-int]
    restart: unless-stopped

  # Started only after the five criteria: `docker compose --profile lead up -d lead`.
  lead:
    profiles: [lead]
    image: ${SWARM_WORKER_IMAGE}
    platform: linux/amd64
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: [*telemetry-off, *claude-gateway]
      API_KEY: ${API_KEY}
      AGENT_ID: ${LEAD_AGENT_ID}
      AGENT_ROLE: lead
      MCP_BASE_URL: http://api:3013
      AGENT_FS_API_URL: http://agent-fs:7433
      GITHUB_EMAIL: lead@localhost
      GITHUB_NAME: Spike Lead
    extra_hosts:
      - "${GATEWAY_HOST}:172.31.240.250"
    volumes:
      - swarm_logs:/logs
      - swarm_lead:/workspace/personal
    networks: [swarm-int]
    restart: unless-stopped

networks:
  swarm-int:
    internal: true
    ipam:
      config:
        - subnet: 172.31.240.0/24
  egress: {}
  host-port: {}
  verifier:
    internal: true
    ipam:
      config:
        - subnet: 172.31.241.0/24

secrets:
  encryption_key:
    file: ./secrets/encryption_key

volumes:
  agent_fs_minio:
  agent_fs_data:
  swarm_api_data:
  swarm_logs:
  swarm_worker:
  swarm_lead:
